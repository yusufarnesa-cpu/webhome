  ========================================== -->  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script>

    const SUPABASE_URL =
      "https://hqzishiazabguknallei.supabase.co";


    const SUPABASE_ANON_KEY =
      "sb_publishable_r8rspBje6vjTvF9lKYzA_SakK9CD5";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    // =========================================
    // ELEMENT
    // =========================================

    const quizTitle =
      document.getElementById("quizTitle");

    const participant =
      document.getElementById("participant");

    const score =
      document.getElementById("score");

    const totalQuestions =
      document.getElementById("totalQuestions");

    const correctAnswers =
      document.getElementById("correctAnswers");

    const wrongAnswers =
      document.getElementById("wrongAnswers");

    const unanswered =
      document.getElementById("unanswered");

    const timeInfo =
      document.getElementById("timeInfo");

    const reviewContainer =
      document.getElementById("reviewContainer");

    const retryButton =
      document.getElementById("retryButton");


    // =========================================
    // ESCAPE HTML
    // =========================================

    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    // =========================================
    // FORMAT WAKTU
    // =========================================

    function formatDuration(
      startedAt,
      submittedAt
    ) {

      if (!startedAt || !submittedAt) {
        return "-";
      }

      const start =
        new Date(startedAt);

      const end =
        new Date(submittedAt);

      const seconds =
        Math.max(
          0,
          Math.floor(
            (end - start) / 1000
          )
        );

      const minutes =
        Math.floor(
          seconds / 60
        );

      const remainingSeconds =
        seconds % 60;

      return `${minutes} menit ${remainingSeconds} detik`;

    }


    // =========================================
    // LOAD RESULT
    // =========================================

    async function loadResult() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const attemptId =
        params.get("attempt");


      if (!attemptId) {

        showError(
          "ID hasil CBT tidak ditemukan."
        );

        return;

      }


      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "get_quiz_attempt_result",
          {
            p_attempt_id:
              Number(attemptId)
          }
        );


      if (error) {

        console.error(
          "Error mengambil hasil:",
          error
        );

        showError(
          "Hasil CBT tidak dapat dimuat. Silakan kembali ke daftar CBT."
        );

        return;

      }


      if (!data) {

        showError(
          "Data hasil CBT tidak ditemukan."
        );

        return;

      }


      renderResult(data);

    }


    // =========================================
    // RENDER RESULT
    // =========================================

    function renderResult(data) {

      quizTitle.textContent =
        data.quiz_title ||
        "CBT";


      participant.textContent =
        `Peserta: ${
          data.participant_name || "-"
        }`;


      score.textContent =
        Number(
          data.score || 0
        ).toFixed(2);


      totalQuestions.textContent =
        data.total_questions || 0;


      correctAnswers.textContent =
        data.correct_answers || 0;


      wrongAnswers.textContent =
        data.wrong_answers || 0;


      unanswered.textContent =
        data.unanswered || 0;


      timeInfo.textContent =
        `Waktu pengerjaan: ${
          formatDuration(
            data.started_at,
            data.submitted_at
          )
        }`;


      // Tombol ulangi CBT
      retryButton.onclick =
        function() {

          if (!data.quiz_id) {
            return;
          }

          window.location.href =
            `cbt.html?id=${data.quiz_id}`;

        };


      renderReview(
        data.questions || []
      );

    }


    // =========================================
    // RENDER PEMBAHASAN
    // =========================================

    function renderReview(
      questions
    ) {

      if (!questions.length) {

        reviewContainer.innerHTML = `
          <div class="error">
            Pembahasan belum tersedia.
          </div>
        `;

        return;

      }


      reviewContainer.className = "";


      reviewContainer.innerHTML =
        questions
          .map(
            (item) => {

              let statusClass;
              let statusText;


              if (
                item.is_answered !== true
              ) {

                statusClass =
                  "unanswered-status";

                statusText =
                  "⚪ Tidak Dijawab";

              } else if (
                item.is_correct === true
              ) {

                statusClass =
                  "correct-status";

                statusText =
                  "✅ Benar";

              } else {

                statusClass =
                  "wrong-status";

                statusText =
                  "❌ Salah";

              }


              let selectedAnswer;


              if (
                item.is_answered === true
              ) {

                selectedAnswer = `
                  <div class="answer-item selected-answer">

                    <div class="answer-label">
                      Jawaban Kamu
                    </div>

                    ${escapeHtml(
                      item.selected_option
                    )}

                  </div>
                `;

              } else {

                selectedAnswer = `
                  <div class="answer-item unanswered-answer">

                    <div class="answer-label">
                      Jawaban Kamu
                    </div>

                    Tidak dijawab

                  </div>
                `;

              }


              return `

                <article
                  class="question-review"
                >

                  <div
                    class="question-header"
                  >

                    <div
                      class="question-number"
                    >
                      Soal ${
                        escapeHtml(
                          item.question_number
                        )
                      }
                    </div>

                    <div
                      class="status ${statusClass}"
                    >
                      ${statusText}
                    </div>

                  </div>


                  <div
                    class="question-body"
                  >

                    <div
                      class="question-text"
                    >
                      ${escapeHtml(
                        item.question
                      )}
                    </div>


                    <div class="answer-box">

                      ${selectedAnswer}


                      <div
                        class="answer-item correct-answer"
                      >

                        <div
                          class="answer-label"
                        >
                          Jawaban Benar
                        </div>

                        ${escapeHtml(
                          item.correct_option
                        )}

                      </div>

                    </div>


                    <div class="explanation">

                      <div
                        class="explanation-title"
                      >
                        📖 Pembahasan
                      </div>

                      ${
                        escapeHtml(
                          item.explanation ||
                          "Pembahasan belum tersedia."
                        )
                      }

                    </div>

                  </div>

                </article>

              `;

            }
          )
          .join("");

    }


    // =========================================
    // ERROR
    // =========================================

    function showError(
      message
    ) {

      document.querySelector(
        ".container"
      ).innerHTML = `

        <div class="result-card">

          <div class="error">

            <h2>
              ${escapeHtml(message)}
            </h2>

            <p
              style="
                margin-top:10px;
              "
            >
              Silakan kembali ke daftar CBT.
            </p>

            <a
              href="quiz.html"
              class="btn-primary"
              style="
                display:inline-block;
                margin-top:20px;
              "
            >
              ← Kembali ke CBT
            </a>

          </div>

        </div>

      `;

    }


    // =========================================
    // START
    // =========================================

    loadResult();

  </script></body></html>
