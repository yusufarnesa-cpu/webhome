<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quiz | Medical Learning Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
      min-height: 100vh;
    }

    nav {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #2563eb;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 24px;
    }

    .nav-links a {
      text-decoration: none;
      color: #374151;
      font-size: 14px;
    }

    .nav-links a:hover {
      color: #2563eb;
    }

    .hero {
      padding: 60px 6% 40px;
      background: linear-gradient(135deg, #eff6ff, #ffffff);
    }

    .hero h1 {
      font-size: 36px;
      margin-bottom: 12px;
      color: #111827;
    }

    .hero p {
      max-width: 700px;
      color: #6b7280;
      line-height: 1.6;
    }

    .container {
      width: 88%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 0 70px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .top-bar h2 {
      font-size: 24px;
    }

    .search-box {
      width: 300px;
      max-width: 100%;
    }

    .search-box input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }

    .search-box input:focus {
      border-color: #2563eb;
    }

    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 22px;
    }

    .quiz-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      min-height: 260px;
    }

    .quiz-card h3 {
      font-size: 19px;
      margin-bottom: 10px;
      color: #111827;
    }

    .quiz-description {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 18px;
      flex-grow: 1;
    }

    .quiz-info {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .badge {
      background: #eff6ff;
      color: #2563eb;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 50px 20px;
      color: #6b7280;
      grid-column: 1 / -1;
    }

    .error {
      color: #dc2626;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #9ca3af;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      nav {
        flex-direction: column;
        gap: 12px;
      }

      .nav-links {
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .hero h1 {
        font-size: 28px;
      }

      .container {
        width: 92%;
      }

      .top-bar {
        align-items: stretch;
      }

      .search-box {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html" class="logo">Medical Learning Hub</a>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="materi/index.html">Materi Pembelajaran</a>
      <a href="quiz.html">Quiz</a>
      <a href="#">Referensi</a>
    </div>
  </nav>

  <section class="hero">
    <h1>Quiz & CBT</h1>
    <p>
      Uji pemahamanmu melalui berbagai Computer Based Test
      yang tersedia di Medical Learning Hub.
    </p>
  </section>

  <main class="container">

    <div class="top-bar">
      <h2>Daftar CBT</h2>

      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="Cari CBT..."
        >
      </div>
    </div>

    <div id="quizGrid" class="quiz-grid">
      <div class="loading">
        Memuat daftar CBT...
      </div>
    </div>

  </main>

  <footer>
    Medical Learning Hub
  </footer>

  <script>
    const SUPABASE_URL =
      "https://hqzishiazabguknallei.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_r8rspBje6vjTvUsF9lKYzA_SakK9CD5";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const quizGrid =
      document.getElementById("quizGrid");

    const searchInput =
      document.getElementById("searchInput");

    let quizzes = [];

    async function loadQuizzes() {

      quizGrid.innerHTML = `
        <div class="loading">
          Memuat daftar CBT...
        </div>
      `;

      const { data, error } = await supabaseClient
        .from("quizzes")
        .select(`
          id,
          title,
          description,
          duration_minutes,
          start_time,
          end_time,
          status,
          category_id,
          categories (
            name
          )
        `)
        .eq("status", "published")
        .order("created_at", {
          ascending: false
        });

      if (error) {
        console.error(error);

        quizGrid.innerHTML = `
          <div class="error">
            Gagal memuat CBT.<br>
            ${error.message}
          </div>
        `;

        return;
      }

      quizzes = data || [];

      await addQuestionCounts();

      renderQuizzes(quizzes);
    }

    async function addQuestionCounts() {

      if (!quizzes.length) {
        return;
      }

      const quizIds =
        quizzes.map(quiz => quiz.id);

      const { data, error } = await supabaseClient
        .from("quiz_questions")
        .select("id, quiz_id")
        .in("quiz_id", quizIds);

      if (error) {
        console.error(
          "Gagal mengambil jumlah soal:",
          error
        );

        quizzes = quizzes.map(quiz => ({
          ...quiz,
          question_count: 0
        }));

        return;
      }

      quizzes = quizzes.map(quiz => {

        const count =
          (data || []).filter(
            question =>
              question.quiz_id === quiz.id
          ).length;

        return {
          ...quiz,
          question_count: count
        };
      });
    }

    function renderQuizzes(list) {

      if (!list.length) {

        quizGrid.innerHTML = `
          <div class="empty">
            Belum ada CBT yang tersedia.
          </div>
        `;

        return;
      }

      quizGrid.innerHTML =
        list.map(quiz => {

          const category =
            quiz.categories?.name ||
            "Umum";

          const duration =
            quiz.duration_minutes ||
            60;

          const questionCount =
            quiz.question_count ||
            0;

          return `
            <article class="quiz-card">

              <h3>
                ${escapeHTML(quiz.title)}
              </h3>

              <p class="quiz-description">
                ${
                  escapeHTML(
                    quiz.description ||
                    "Tidak ada deskripsi."
                  )
                }
              </p>

              <div class="quiz-info">

                <span class="badge">
                  ${escapeHTML(category)}
                </span>

                <span class="badge">
                  ${duration} menit
                </span>

                <span class="badge">
                  ${questionCount} soal
                </span>

              </div>

              <a
                class="btn"
                href="cbt.html?id=${quiz.id}"
              >
                Lihat CBT
              </a>

            </article>
          `;

        }).join("");
    }

    searchInput.addEventListener(
      "input",
      function () {

        const keyword =
          this.value
            .toLowerCase()
            .trim();

        const filtered =
          quizzes.filter(quiz => {

            const title =
              (quiz.title || "")
                .toLowerCase();

            const description =
              (quiz.description || "")
                .toLowerCase();

            const category =
              (quiz.categories?.name || "")
                .toLowerCase();

            return (
              title.includes(keyword) ||
              description.includes(keyword) ||
              category.includes(keyword)
            );
          });

        renderQuizzes(filtered);
      }
    );

    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadQuizzes();
  </script>

</body>
</html>
