<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Detail Materi - Learning Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      line-height: 1.7;
    }

    header {
      background: #172033;
      color: white;
      padding: 18px 20px;
    }

    .header-inner {
      width: 92%;
      max-width: 900px;
      margin: auto;
    }

    .header-inner h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: 30px auto 60px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #172033;
      text-decoration: none;
      font-weight: bold;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
    }

    .material-title {
      margin: 0 0 15px;
      font-size: 32px;
      line-height: 1.3;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 25px;
    }

    .tag {
      background: #eef2f7;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      color: #344054;
    }

    .description {
      background: #f8fafc;
      border-left: 4px solid #172033;
      padding: 16px;
      margin-bottom: 30px;
      border-radius: 6px;
    }

    .content {
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .content-title {
      margin-top: 0;
      margin-bottom: 15px;
    }

    /* REFERENSI */

    .references {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid #e4e7ec;
    }

    .references-title {
      margin: 0 0 18px;
      font-size: 24px;
    }

    .reference-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .reference-item {
      background: #f8fafc;
      border: 1px solid #e4e7ec;
      border-radius: 12px;
      padding: 18px;
    }

    .reference-item h3 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .reference-type {
      display: inline-block;
      background: #eef2f7;
      color: #344054;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .reference-description {
      margin: 5px 0 14px;
      color: #667085;
      font-size: 14px;
    }

    .reference-link {
      display: inline-block;
      text-decoration: none;
      background: #172033;
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .reference-link:hover {
      opacity: 0.9;
    }

    .no-reference {
      color: #667085;
      background: #f8fafc;
      padding: 15px;
      border-radius: 10px;
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #667085;
    }

    .error {
      text-align: center;
      padding: 40px 20px;
      color: #b42318;
    }

    .debug {
      margin-top: 20px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 8px;
      font-size: 12px;
      color: #667085;
      word-break: break-word;
    }

    @media (max-width: 600px) {

      .container {
        width: 94%;
      }

      .card {
        padding: 20px;
      }

      .material-title {
        font-size: 26px;
      }

      .references-title {
        font-size: 21px;
      }
    }
  </style>

</head>

<body>

<header>
  <div class="header-inner">
    <h1>Learning Hub</h1>
  </div>
</header>


<main class="container">

  <a href="materi/" class="back-link">
    ← Kembali ke Materi
  </a>


  <div id="detail" class="card">

    <div class="loading">
      Memuat materi...
    </div>

  </div>

</main>


<script>

const SUPABASE_URL =
  "https://hqzishiazabguknallei.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_r8rspBje6vjTvUsF9lKYzA_SakK9CD5";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


const detail =
  document.getElementById("detail");


const params =
  new URLSearchParams(
    window.location.search
  );


const materialId =
  params.get("id");


console.log("ID materi:", materialId);


if (!materialId) {

  detail.innerHTML = `
    <div class="error">

      <h2>ID Materi Tidak Ada</h2>

      <p>URL harus memiliki format:</p>

      <p>
        <strong>detail.html?id=1</strong>
      </p>

    </div>
  `;

} else {

  loadMaterial();

}


/* =========================
   LOAD MATERIAL
========================= */

async function loadMaterial() {

  try {

    const { data, error } =
      await supabaseClient
        .from("materials")
        .select("*")
        .eq("id", materialId)
        .single();


    console.log("Data materi:", data);
    console.log("Error Supabase:", error);


    if (error) {

      detail.innerHTML = `
        <div class="error">

          <h2>Gagal Memuat Materi</h2>

          <p>
            Supabase memberikan error saat mengambil data.
          </p>

          <div class="debug">
            ${escapeHtml(error.message)}
          </div>

        </div>
      `;

      return;
    }


    if (!data) {

      detail.innerHTML = `
        <div class="error">

          <h2>Materi Tidak Ditemukan</h2>

          <p>
            Data materi dengan ID tersebut tidak tersedia.
          </p>

        </div>
      `;

      return;
    }


    /*
      Ambil referensi berdasarkan material_id
    */

    const {
      data: resources,
      error: resourceError
    } = await supabaseClient
      .from("resources")
      .select("*")
      .eq("material_id", materialId)
      .order("created_at", {
        ascending: false
      });


    console.log(
      "Referensi materi:",
      resources
    );

    console.log(
      "Error referensi:",
      resourceError
    );


    /*
      Jika referensi gagal dimuat,
      materi tetap ditampilkan.
    */

    if (resourceError) {

      console.error(
        "Gagal mengambil referensi:",
        resourceError
      );

    }


    let referenceHTML = "";


    if (
      resources &&
      resources.length > 0
    ) {

      referenceHTML = `

        <section class="references">

          <h2 class="references-title">
            📚 Referensi Materi
          </h2>

          <div class="reference-list">

            ${resources.map(resource => `

              <div class="reference-item">

                <h3>
                  ${escapeHtml(resource.title)}
                </h3>

                ${
                  resource.type
                    ? `
                      <span class="reference-type">
                        ${escapeHtml(resource.type)}
                      </span>
                    `
                    : ""
                }

                ${
                  resource.description
                    ? `
                      <p class="reference-description">
                        ${escapeHtml(resource.description)}
                      </p>
                    `
                    : ""
                }

                ${
                  resource.url
                    ? `
                      <a
                        href="${escapeAttribute(resource.url)}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="reference-link"
                      >
                        Buka Referensi →
                      </a>
                    `
                    : ""
                }

              </div>

            `).join("")}

          </div>

        </section>

      `;

    } else {

      referenceHTML = `

        <section class="references">

          <h2 class="references-title">
            📚 Referensi Materi
          </h2>

          <div class="no-reference">
            Belum ada referensi untuk materi ini.
          </div>

        </section>

      `;

    }


    /*
      Tampilkan materi + referensi
    */

    detail.innerHTML = `

      <h1 class="material-title">
        ${escapeHtml(data.title)}
      </h1>


      <div class="meta">

        ${
          data.subject
            ? `
              <span class="tag">
                ${escapeHtml(data.subject)}
              </span>
            `
            : ""
        }


        ${
          data.semester
            ? `
              <span class="tag">
                Semester ${escapeHtml(data.semester)}
              </span>
            `
            : ""
        }


        ${
          data.topic
            ? `
              <span class="tag">
                ${escapeHtml(data.topic)}
              </span>
            `
            : ""
        }

      </div>


      ${
        data.description
          ? `
            <div class="description">

              <strong>
                Deskripsi
              </strong>

              <br>

              ${escapeHtml(data.description)}

            </div>
          `
          : ""
      }


      <div class="content">

        <h2 class="content-title">
          Isi Materi
        </h2>

        ${
          data.content
            ? escapeHtml(data.content)
            : "Belum ada isi materi."
        }

      </div>


      ${referenceHTML}

    `;


  } catch (err) {

    console.error(
      "Error:",
      err
    );


    detail.innerHTML = `

      <div class="error">

        <h2>
          Terjadi Kesalahan
        </h2>

        <p>
          Tidak dapat memuat materi.
        </p>

        <div class="debug">
          ${escapeHtml(err.message)}
        </div>

      </div>

    `;

  }

}


/* =========================
   SECURITY HELPERS
========================= */

function escapeHtml(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeAttribute(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

}

</script>

</body>
</html>
