<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Detail Materi - Learning Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      line-height: 1.7;
    }

    header {
      background: #172033;
      color: white;
      padding: 18px 20px;
    }

    .header-inner {
      width: 92%;
      max-width: 900px;
      margin: auto;
    }

    .header-inner h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: 25px auto 50px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      color: #172033;
      text-decoration: none;
      font-weight: bold;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .material-title {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 30px;
      line-height: 1.3;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tag {
      background: #eef2f7;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      color: #344054;
    }

    .description {
      background: #f8fafc;
      border-left: 4px solid #172033;
      padding: 15px;
      margin-bottom: 25px;
      border-radius: 6px;
    }

    .content {
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .content h2 {
      margin-top: 0;
    }

    .loading,
    .error {
      text-align: center;
      padding: 40px 20px;
      color: #667085;
    }

    .error {
      color: #b42318;
    }

    @media (max-width: 600px) {

      .container {
        width: 94%;
      }

      .card {
        padding: 20px;
      }

      .material-title {
        font-size: 25px;
      }

    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <h1>Learning Hub</h1>
  </div>
</header>


<main class="container">

  <a
    href="materi/"
    class="back-link">
    ← Kembali ke Materi
  </a>


  <div
    id="detail"
    class="card">

    <div class="loading">
      Memuat materi...
    </div>

  </div>

</main>


<script>

const SUPABASE_URL =
  "https://hqzishiazabguknallei.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_r8rspBje6vjTvUsF9lKYzA_SakK9CD5";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================
   AMBIL ID DARI URL
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const materialId =
  params.get("id");


/* =========================
   ELEMENT DETAIL
========================= */

const detail =
  document.getElementById("detail");


/* =========================
   VALIDASI ID
========================= */

if (!materialId) {

  detail.innerHTML = `
    <div class="error">
      <h2>Materi tidak ditemukan</h2>
      <p>ID materi tidak tersedia.</p>
    </div>
  `;

} else {

  loadMaterial();

}


/* =========================
   LOAD MATERIAL
========================= */

async function loadMaterial() {

  const {
    data,
    error
  } =
    await supabaseClient

      .from("materials")

      .select(`
        *,
        categories (
          name
        )
      `)

      .eq("id", materialId)

      .eq("status", "published")

      .single();


  if (error) {

    console.error(
      "Gagal mengambil materi:",
      error
    );

    detail.innerHTML = `
      <div class="error">
        <h2>Materi tidak ditemukan</h2>
        <p>
          Materi mungkin sudah dihapus
          atau belum dipublikasikan.
        </p>
      </div>
    `;

    return;
  }


  if (!data) {

    detail.innerHTML = `
      <div class="error">
        <h2>Materi tidak ditemukan</h2>
      </div>
    `;

    return;
  }


  const categoryName =
    data.categories &&
    data.categories.name
      ? data.categories.name
      : "";


  detail.innerHTML = `

    <h1 class="material-title">
      ${escapeHtml(data.title)}
    </h1>


    <div class="meta">

      ${
        categoryName
          ? `
            <span class="tag">
              ${escapeHtml(categoryName)}
            </span>
          `
          : ""
      }


      ${
        data.subject
          ? `
            <span class="tag">
              ${escapeHtml(data.subject)}
            </span>
          `
          : ""
      }


      ${
        data.semester
          ? `
            <span class="tag">
              Semester ${escapeHtml(data.semester)}
            </span>
          `
          : ""
      }


      ${
        data.topic
          ? `
            <span class="tag">
              ${escapeHtml(data.topic)}
            </span>
          `
          : ""
      }

    </div>


    ${
      data.description
        ? `
          <div class="description">
            <strong>Deskripsi</strong>
            <br>
            ${escapeHtml(data.description)}
          </div>
        `
        : ""
    }


    <div class="content">

      <h2>Isi Materi</h2>

      ${
        data.content
          ? escapeHtml(data.content)
          : "Belum ada isi materi."
      }

    </div>

  `;

}


/* =========================
   KEAMANAN OUTPUT
========================= */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}

</script>

</body>
</html>
