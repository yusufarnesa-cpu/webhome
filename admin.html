<script>
  /* ============================================================
     SUPABASE
  ============================================================ */
  const SUPABASE_URL = "https://hqzishiazabguknallei.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_r8rspBje6vjTvUsF9lKYzA_SakK9CD5";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let editingId = null;
  let currentContentFile = null;
  let editingQuizId = null;
  let editingStationId = null;

  /* ============================================================
     UTILITY
  ============================================================ */
  function escapeHtml(value) {
    if (value === null || value === undefined) return "";
    return String(value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }
  function escapeAttribute(v) { return escapeHtml(v); }

  function showMessage(elementId, message, type = "success") {
    const el = document.getElementById(elementId);
    if (!el) return;
    el.textContent = message;
    el.className = "message " + type;
  }

  /* ============================================================
     CHECK ADMIN
  ============================================================ */
  async function checkAdmin() {
    const { data: { user }, error } = await supabaseClient.auth.getUser();
    if (error || !user) {
      alert("Anda belum login sebagai admin.");
      window.location.href = "login.html";
      return false;
    }
    const { data: profile, error: pe } = await supabaseClient
      .from("profiles").select("role").eq("id", user.id).single();
    if (pe || !profile || profile.role !== "admin") {
      alert("Akses ditolak. Halaman ini hanya untuk admin.");
      window.location.href = "index.html";
      return false;
    }
    return true;
  }

  /* ============================================================
     CATEGORY
  ============================================================ */
  async function loadCategories() {
    const { data, error } = await supabaseClient
      .from("categories").select("*").order("id", { ascending: true });

    const categoryList = document.getElementById("categoryList");
    if (error) {
      console.error(error);
      categoryList.innerHTML = '<div class="empty">Gagal memuat kategori.</div>';
      return;
    }

    if (!data || data.length === 0) {
      categoryList.innerHTML = '<div class="empty">Belum ada kategori.</div>';
    } else {
      categoryList.innerHTML = data.map(c => `
        <div class="item">
          <div class="item-title">${escapeHtml(c.name)}</div>
          <div class="item-description">${escapeHtml(c.description || "Tidak ada deskripsi.")}</div>
          <button class="btn-danger" onclick="deleteCategory(${c.id})">Hapus</button>
        </div>
      `).join("");
    }

    populateCategorySelect(data);
    populateBatchCategorySelect(data);
  }

  function populateCategorySelect(cats) {
    const s = document.getElementById("category");
    s.innerHTML = '<option value="">Pilih kategori</option>';
    cats.forEach(c => {
      const o = document.createElement("option");
      o.value = c.id; o.textContent = c.name;
      s.appendChild(o);
    });
  }
  function populateBatchCategorySelect(cats) {
    const s = document.getElementById("batchCategory");
    s.innerHTML = '<option value="">Pilih kategori</option>';
    cats.forEach(c => {
      const o = document.createElement("option");
      o.value = c.id; o.textContent = c.name;
      s.appendChild(o);
    });
  }

  async function addCategory() {
    const name = document.getElementById("categoryName").value.trim();
    const description = document.getElementById("categoryDescription").value.trim();
    if (!name) { showMessage("categoryMessage", "Nama blok wajib diisi.", "error"); return; }

    const { error } = await supabaseClient.from("categories").insert({ name, description });
    if (error) { showMessage("categoryMessage", "Gagal: " + error.message, "error"); return; }

    document.getElementById("categoryName").value = "";
    document.getElementById("categoryDescription").value = "";
    showMessage("categoryMessage", "Kategori berhasil ditambahkan.", "success");
    loadCategories();
  }

  async function deleteCategory(id) {
    if (!confirm("Hapus kategori ini?")) return;
    const { error } = await supabaseClient.from("categories").delete().eq("id", id);
    if (error) { alert("Gagal: " + error.message); return; }
    loadCategories();
  }

  /* ============================================================
     MATERIAL
  ============================================================ */
  function updateContentSource() {
    const src = document.querySelector('input[name="contentSource"]:checked').value;
    const t = document.getElementById("contentTextSection");
    const u = document.getElementById("contentUploadSection");
    const r = document.getElementById("contentUrlSection");
    const oT = document.getElementById("sourceOptText");
    const oU = document.getElementById("sourceOptUpload");
    const oR = document.getElementById("sourceOptUrl");

    oT.classList.remove("selected"); oU.classList.remove("selected"); oR.classList.remove("selected");
    t.style.display = "none"; u.style.display = "none"; r.style.display = "none";

    if (src === "text") { t.style.display = "block"; oT.classList.add("selected"); }
    else if (src === "upload") { u.style.display = "block"; oU.classList.add("selected"); }
    else { r.style.display = "block"; oR.classList.add("selected"); }
  }

  function showExistingContentFile(file) {
    currentContentFile = file;
    const box = document.getElementById("contentExistingFileInfo");
    const link = document.getElementById("contentExistingFileLink");
    if (file && file.url) {
      box.style.display = "flex";
      link.href = file.url; link.textContent = file.url;
    } else {
      box.style.display = "none"; link.href = "#"; link.textContent = "-";
    }
  }

  function removeExistingContentFile() {
    if (!confirm("Hapus file yang terhubung dengan materi ini?")) return;
    const box = document.getElementById("contentExistingFileInfo");
    box.style.display = "none"; box.dataset.removed = "true";
    currentContentFile = null;
  }

  async function uploadMaterialFile(file) {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = "material_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8) + "_" + safeName;
    const { data, error } = await supabaseClient.storage.from("references").upload(path, file, { upsert: false });
    if (error) throw error;
    const { data: pub } = supabaseClient.storage.from("references").getPublicUrl(data.path);
    return { path: data.path, url: pub.publicUrl };
  }

  async function loadMaterials() {
    const { data, error } = await supabaseClient
      .from("materials").select(`*, categories ( name )`).order("created_at", { ascending: false });

    const c = document.getElementById("materials");
    if (error) { console.error(error); c.innerHTML = '<div class="empty">Gagal memuat materi.</div>'; return; }
    if (!data || data.length === 0) { c.innerHTML = '<div class="empty">Belum ada materi.</div>'; return; }

    c.innerHTML = data.map(m => `
      <div class="item">
        <div class="item-title">${escapeHtml(m.title)}</div>
        <div class="item-meta">${escapeHtml(m.subject || "-")} • ${escapeHtml(m.semester || "-")} • ${escapeHtml(m.categories?.name || "Tanpa kategori")}</div>
        <div class="item-description">${escapeHtml(m.description || "")}</div>
        <div class="button-row">
          <button class="btn-warning" onclick="editMaterial(${m.id})">Edit</button>
          <button class="btn-danger" onclick="deleteMaterial(${m.id})">Hapus</button>
        </div>
      </div>
    `).join("");
  }

  async function saveMaterial() {
    const title = document.getElementById("title").value.trim();
    const subject = document.getElementById("subject").value.trim();
    const semester = document.getElementById("semester").value.trim();
    const topic = document.getElementById("topic").value.trim();
    const categoryId = document.getElementById("category").value || null;
    const description = document.getElementById("description").value.trim();
    const src = document.querySelector('input[name="contentSource"]:checked').value;

    if (!title) { showMessage("message", "Judul materi wajib diisi.", "error"); return; }

    let contentText = "", contentFileType = null, contentFile = null, contentUrl = null;

    if (src === "text") contentText = document.getElementById("content").value.trim();
    else if (src === "upload") {
      contentFileType = document.getElementById("contentFileType").value;
      contentFile = document.getElementById("contentFile").files[0];
      if (!contentFileType) { showMessage("message", "Pilih jenis file dulu.", "error"); return; }
      if (!editingId && !contentFile) { showMessage("message", "Pilih file dulu.", "error"); return; }
      if (editingId && !contentFile && !currentContentFile) { showMessage("message", "Belum ada file.", "error"); return; }
    } else {
      contentFileType = document.getElementById("contentUrlType").value;
      contentUrl = document.getElementById("contentUrl").value.trim();
      if (!contentFileType) { showMessage("message", "Pilih jenis konten dulu.", "error"); return; }
      if (!contentUrl) { showMessage("message", "Masukkan URL.", "error"); return; }
    }

    const data = {
      title, subject, semester, topic,
      category_id: categoryId ? Number(categoryId) : null,
      description,
      content: src === "text" ? contentText : null,
      status: "published"
    };

    showMessage("message", "Menyimpan materi...", "info");
    let materialId = editingId, error;

    if (editingId) {
      ({ error } = await supabaseClient.from("materials").update(data).eq("id", editingId));
    } else {
      const r = await supabaseClient.from("materials").insert(data).select().single();
      error = r.error;
      if (!error && r.data) materialId = r.data.id;
    }
    if (error) { showMessage("message", "Gagal: " + error.message, "error"); return; }

    try {
      const box = document.getElementById("contentExistingFileInfo");
      const wasRemoved = box.dataset.removed === "true";

      const { data: oldFiles } = await supabaseClient.from("material_files").select("file_path").eq("material_id", materialId);

      if (src === "text" || src === "url" || (src === "upload" && (contentFile || wasRemoved))) {
        if (oldFiles && oldFiles.length > 0) {
          const paths = oldFiles.map(f => f.file_path).filter(Boolean);
          if (paths.length) await supabaseClient.storage.from("references").remove(paths);
        }
        await supabaseClient.from("material_files").delete().eq("material_id", materialId);
      }

      if (src === "upload" && contentFile) {
        const up = await uploadMaterialFile(contentFile);
        await supabaseClient.from("material_files").insert({
          material_id: materialId, title, description,
          type: contentFileType, url: up.url, file_path: up.path
        });
      } else if (src === "url") {
        await supabaseClient.from("material_files").insert({
          material_id: materialId, title, description,
          type: contentFileType, url: contentUrl, file_path: null
        });
      }
    } catch (e) {
      console.error(e);
      showMessage("message", "Materi tersimpan, file gagal: " + e.message, "error");
      loadMaterials(); loadResourceMaterials(); return;
    }

    showMessage("message", editingId ? "Materi diperbarui." : "Materi ditambahkan.", "success");
    clearForm(); loadMaterials(); loadResourceMaterials();
  }

  async function editMaterial(id) {
    const { data, error } = await supabaseClient.from("materials").select("*").eq("id", id).single();
    if (error || !data) { alert("Gagal ambil data materi."); return; }

    clearForm(); editingId = id;
    document.getElementById("title").value = data.title || "";
    document.getElementById("subject").value = data.subject || "";
    document.getElementById("semester").value = data.semester || "";
    document.getElementById("topic").value = data.topic || "";
    document.getElementById("category").value = data.category_id || "";
    document.getElementById("description").value = data.description || "";

    const { data: files } = await supabaseClient.from("material_files")
      .select("*").eq("material_id", id).order("created_at", { ascending: false }).limit(1);
    const file = (files && files.length) ? files[0] : null;

    if (file) {
      if (file.file_path) {
        document.querySelector('input[name="contentSource"][value="upload"]').checked = true;
        document.getElementById("contentFileType").value = file.type || "";
        showExistingContentFile(file);
      } else {
        document.querySelector('input[name="contentSource"][value="url"]').checked = true;
        document.getElementById("contentUrlType").value = file.type || "";
        document.getElementById("contentUrl").value = file.url || "";
      }
    } else {
      document.querySelector('input[name="contentSource"][value="text"]').checked = true;
      document.getElementById("content").value = data.content || "";
    }

    updateContentSource();
    showMessage("message", "Mode edit aktif.", "info");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function deleteMaterial(id) {
    if (!confirm("Hapus materi ini? Referensi & file ikut terhapus.")) return;

    const { data: files } = await supabaseClient.from("material_files").select("file_path").eq("material_id", id);
    if (files && files.length) {
      const paths = files.map(f => f.file_path).filter(Boolean);
      if (paths.length) await supabaseClient.storage.from("references").remove(paths);
    }
    const { error } = await supabaseClient.from("materials").delete().eq("id", id);
    if (error) { alert("Gagal: " + error.message); return; }

    loadMaterials(); loadResourceMaterials(); loadResources();
  }

  function clearForm() {
    editingId = null; currentContentFile = null;
    ["title","subject","semester","topic","category","description","content",
     "contentFileType","contentUrlType","contentUrl"].forEach(id => {
      const el = document.getElementById(id); if (el) el.value = "";
    });
    document.getElementById("contentFile").value = "";
    document.querySelector('input[name="contentSource"][value="text"]').checked = true;

    const box = document.getElementById("contentExistingFileInfo");
    box.style.display = "none"; box.dataset.removed = "false";
    document.getElementById("contentExistingFileLink").href = "#";
    document.getElementById("contentExistingFileLink").textContent = "-";

    updateContentSource();
    document.getElementById("message").className = "message";
  }

  /* ============================================================
     RESOURCES
  ============================================================ */

    const { data, error } = await supabaseClient.from("materials").select("id, title").order("title");
    if (error) { console.error(error); return; }
    const s = document.getElementById("resourceMaterial");
    s.innerHTML = '<option value="">Pilih materi</option>';

      const o = document.createElement("option"); o.value = m.id; o.textContent = m.title;
      s.appendChild(o);

  function updateResourceSource() {
    const src = document.querySelector('input[name="resourceSource"]:checked').value;
    document.getElementById("resourceFileSection").style.display = src === "upload" ? "block" : "none";
    document.getElementById("resourceUrlSection").style.display = src === "url" ? "block" : "none";
  }

  function clearResourceForm() {
    ["resourceTitle","resourceType","resourceUrl","resourceDescription","resourceFile"].forEach(id => {
      const el = document.getElementById(id); if (el) el.value = "";
    });
    document.querySelector('input[name="resourceSource"][value="upload"]').checked = true;
    updateResourceSource();
    document.getElementById("resourceMessage").className = "message";

  async function uploadMaterialResourceFile(file) {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = Date.now() + "_" + Math.random().toString(36).slice(2, 8) + "_" + safeName;
    const { data, error } = await supabaseClient.storage.from("references").upload(path, file, { upsert: false });
    if (error) throw error;
    const { data: pub } = supabaseClient.storage.from("references").getPublicUrl(data.path);
    return { path: data.path, url: pub.publicUrl };
  }

  async function addResource() {
    const materialId = document.getElementById("resourceMaterial").value;
    const title = document.getElementById("resourceTitle").value.trim();
    const type = document.getElementById("resourceType").value;
    const description = document.getElementById("resourceDescription").value.trim();
    const src = document.querySelector('input[name="resourceSource"]:checked').value;
    const urlInput = document.getElementById("resourceUrl");
    const fileInput = document.getElementById("resourceFile");

    if (!materialId) { showMessage("resourceMessage", "Pilih materi.", "error"); return; }
    if (!title) { showMessage("resourceMessage", "Judul wajib.", "error"); return; }
    if (!type) { showMessage("resourceMessage", "Pilih jenis referensi.", "error"); return; }

    const btn = document.getElementById("resourceSubmitButton");
    btn.disabled = true; btn.textContent = "Menyimpan...";
    let uploadedPath = null;

    try {
      let url = null, filePath = null;
      if (src === "upload") {
        const file = fileInput.files[0];
        if (!file) throw new Error("Pilih file dulu.");
        const up = await uploadMaterialResourceFile(file);
        url = up.url; filePath = up.path; uploadedPath = up.path;
      } else {
        url = urlInput.value.trim();
        if (!url) throw new Error("Masukkan URL.");
      }

      const { error } = await supabaseClient.from("resources").insert({
        title, description, type, url, file_path: filePath, material_id: Number(materialId)
      });
      if (error) {
        if (uploadedPath) await supabaseClient.storage.from("references").remove([uploadedPath]);
        throw error;
      }

      showMessage("resourceMessage", "Referensi ditambahkan.", "success");
      clearResourceForm();
      document.getElementById("resourceMaterial").value = materialId;
      await loadResources();
    } catch (e) {
      console.error(e);
      showMessage("resourceMessage", "Gagal: " + e.message, "error");
    } finally {
      btn.disabled = false; btn.textContent = "➕ Tambahkan Referensi";
    }
  }

  async function loadResources() {
    const { data, error } = await supabaseClient.from("resources")
      .select(`*, materials ( title )`).order("created_at", { ascending: false });

    const c = document.getElementById("resources");
    if (error) { console.error(error); c.innerHTML = '<div class="empty">Gagal memuat referensi.</div>'; return; }
    if (!data || data.length === 0) { c.innerHTML = '<div class="empty">Belum ada referensi.</div>'; return; }

    c.innerHTML = data.map(r => `
      <div class="item">
        <div class="item-title">${escapeHtml(r.title)}</div>
        <div class="item-meta">${escapeHtml(r.type)} • ${escapeHtml(r.materials?.title || "Tanpa materi")}</div>
        <div class="item-description">${escapeHtml(r.description || "")}</div>
        <div class="button-row">
          <a href="${escapeAttribute(r.url || "#")}" target="_blank" rel="noopener noreferrer">
            <button class="btn-primary" type="button">Buka</button>
          </a>
          <button class="btn-danger" onclick="deleteResource(${r.id})">Hapus</button>
        </div>
      </div>
    `).join("");
  }

  async function deleteResource(id) {
    if (!confirm("Hapus referensi ini?")) return;
    const { error } = await supabaseClient.from("resources").delete().eq("id", id);
    if (error) { alert("Gagal: " + error.message); return; }
    loadResources();
  }

  /* ============================================================
     CBT - SINGLE JSON
  ============================================================ */
  function clearCBTForm() {
    document.getElementById("cbtJson").value = "";
    document.getElementById("cbtMessage").className = "message";
  }

  function parseOptionEntry(opt) {
    if (typeof opt === "string") return { text: opt, explanation: null };
    if (opt && typeof opt === "object") {
      const text = opt.text !== undefined ? opt.text : (opt.option_text !== undefined ? opt.option_text : "");
      return { text: String(text), explanation: opt.explanation ? String(opt.explanation) : null };
    }
    return { text: "", explanation: null };
  }

  function validateCBTJson(data) {
    if (!data || typeof data !== "object") throw new Error("JSON tidak valid.");
    if (!data.title || typeof data.title !== "string") throw new Error("Field 'title' wajib.");
    if (!data.category || typeof data.category !== "string") throw new Error("Field 'category' wajib.");
    if (!Array.isArray(data.questions) || data.questions.length === 0) throw new Error("'questions' harus array tidak kosong.");
    if (data.duration_minutes !== undefined &&
        (!Number.isInteger(Number(data.duration_minutes)) || Number(data.duration_minutes) <= 0)) {
      throw new Error("'duration_minutes' harus > 0.");
    }
    data.questions.forEach((item, i) => validateQuestionItem(item, i + 1));
    return true;
  }

  function validateQuestionItem(item, displayNumber) {
    if (!item || typeof item !== "object") throw new Error(`Soal ${displayNumber} tidak valid.`);
    if (!item.question || typeof item.question !== "string") throw new Error(`Soal ${displayNumber}: 'question' wajib.`);
    if (!Array.isArray(item.options) || item.options.length < 2) throw new Error(`Soal ${displayNumber}: minimal 2 pilihan.`);
    item.options.forEach((opt, oi) => {
      const p = parseOptionEntry(opt);
      if (!p.text || !p.text.trim()) throw new Error(`Soal ${displayNumber}: pilihan ${oi + 1} kosong.`);
    });
    const ans = Number(item.answer);
    if (!Number.isInteger(ans) || ans < 1 || ans > item.options.length) {
      throw new Error(`Soal ${displayNumber}: 'answer' harus antara 1 dan ${item.options.length}.`);
    }
  }

  async function findCategoryId(name) {
    const { data, error } = await supabaseClient.from("categories").select("id, name");
    if (error) throw new Error("Gagal ambil kategori: " + error.message);
    const n = name.trim().toLowerCase();
    const c = data.find(i => i.name.trim().toLowerCase() === n);
    if (!c) throw new Error(`Kategori "${name}" tidak ditemukan.`);
    return c.id;
  }

  async function importCBT() {
    const raw = document.getElementById("cbtJson").value.trim();
    if (!raw) { showMessage("cbtMessage", "Paste JSON CBT dulu.", "error"); return; }

    let data;
    try { data = JSON.parse(raw); }
    catch (e) { showMessage("cbtMessage", "JSON tidak valid.", "error"); return; }

    try {
      validateCBTJson(data);
      showMessage("cbtMessage", "Memvalidasi...", "info");

      const categoryId = await findCategoryId(data.category);
      const duration = data.duration_minutes ? Number(data.duration_minutes) : 60;

      const { data: quiz, error: qe } = await supabaseClient.from("quizzes").insert({
        title: data.title.trim(),
        description: data.description || null,
        category_id: categoryId,
        duration_minutes: duration,
        status: "published"
      }).select().single();
      if (qe) throw new Error("Gagal buat CBT: " + qe.message);

      try {
        for (let i = 0; i < data.questions.length; i++) {
          const item = data.questions[i];
          const { data: q, error: qErr } = await supabaseClient.from("quiz_questions").insert({
            quiz_id: quiz.id,
            question: item.question.trim(),
            explanation: item.explanation || null,
            question_number: i + 1
          }).select().single();
          if (qErr) throw new Error(`Soal ${i + 1}: ${qErr.message}`);

          const ans = Number(item.answer);
          const opts = item.options.map((o, oi) => {
            const p = parseOptionEntry(o);
            return {
              question_id: q.id, option_text: p.text.trim(),
              explanation: p.explanation, is_correct: oi + 1 === ans
            };
          });
          const { error: oErr } = await supabaseClient.from("quiz_options").insert(opts);
          if (oErr) throw new Error(`Pilihan soal ${i + 1}: ${oErr.message}`);
        }
      } catch (ie) {
        await supabaseClient.from("quizzes").delete().eq("id", quiz.id);
        throw ie;
      }

      showMessage("cbtMessage", `CBT "${data.title}" berhasil diimport. ${data.questions.length} soal.`, "success");
      clearCBTForm(); loadCBTs();
    } catch (e) {
      console.error(e);
      showMessage("cbtMessage", e.message || "Gagal import CBT.", "error");
    }
  }

  /* ============================================================
     CBT - BATCH SYSTEM
  ============================================================ */
  function getBatchConfig(n) {
    return {
      1: { textarea: "batch1Json", status: "batch1Status", start: 1, end: 25 },
      2: { textarea: "batch2Json", status: "batch2Status", start: 26, end: 50 },
      3: { textarea: "batch3Json", status: "batch3Status", start: 51, end: 75 },
      4: { textarea: "batch4Json", status: "batch4Status", start: 76, end: 100 }
    }[n];
  }

  function parseBatch(n) {
    const cfg = getBatchConfig(n);
    const raw = document.getElementById(cfg.textarea).value.trim();
    if (!raw) throw new Error(`Batch ${n} kosong.`);

    let d;
    try { d = JSON.parse(raw); }
    catch { throw new Error(`Batch ${n}: JSON tidak valid.`); }

    if (!d || typeof d !== "object") throw new Error(`Batch ${n}: format tidak valid.`);
    if (Number(d.batch) !== n) throw new Error(`Batch ${n}: 'batch' harus ${n}.`);
    if (Number(d.start_question) !== cfg.start) throw new Error(`Batch ${n}: 'start_question' harus ${cfg.start}.`);
    if (Number(d.end_question) !== cfg.end) throw new Error(`Batch ${n}: 'end_question' harus ${cfg.end}.`);
    if (!Array.isArray(d.questions)) throw new Error(`Batch ${n}: 'questions' harus array.`);
    if (d.questions.length !== 25) throw new Error(`Batch ${n}: harus 25 soal, ditemukan ${d.questions.length}.`);

    d.questions.forEach((item, i) => validateQuestionItem(item, cfg.start + i));
    return d;
  }

  function updateBatchStatus(n, msg, ok) {
    const el = document.getElementById(getBatchConfig(n).status);
    if (!el) return;
    el.textContent = msg;
    el.style.color = ok ? "#166534" : "#991b1b";
  }

  function resetBatchStats() {
    document.getElementById("batchCount").textContent = "0/4";
    document.getElementById("questionCount").textContent = "0/100";
    document.getElementById("duplicateCount").textContent = "0";
  }

  function normalizeQuestion(q) { return String(q).trim().toLowerCase().replace(/\s+/g, " "); }

  function findDuplicateQuestions(batches) {
    const seen = new Map(), dups = [];
    batches.forEach((b, bi) => b.questions.forEach((q, qi) => {
      const k = normalizeQuestion(q.question);
      const num = getBatchConfig(bi + 1).start + qi;
      if (seen.has(k)) dups.push({ question: q.question, first: seen.get(k), duplicate: num });
      else seen.set(k, num);
    }));
    return dups;
  }

  function validateAllBatches() {
    try {
      const batches = [];
      for (let i = 1; i <= 4; i++) { batches.push(parseBatch(i)); updateBatchStatus(i, "✓ Valid — 25 soal", true); }

      const dups = findDuplicateQuestions(batches);
      document.getElementById("batchCount").textContent = "4/4";
      document.getElementById("questionCount").textContent = "100/100";
      document.getElementById("duplicateCount").textContent = dups.length;

      if (dups.length > 0) throw new Error(`Ditemukan ${dups.length} soal duplikat.`);

      showMessage("batchMessage", "✓ Semua batch valid, 100 soal, tanpa duplikasi.", "success");
      return true;
    } catch (e) {
      console.error(e);
      showMessage("batchMessage", e.message, "error");
      return false;
    }
  }

  function clearBatchForm() {
    ["batchTitle","batchDescription","batchCategory"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("batchDuration").value = "100";
    for (let i = 1; i <= 4; i++) {
      document.getElementById(getBatchConfig(i).textarea).value = "";
      updateBatchStatus(i, "Belum diperiksa");
    }
    resetBatchStats();
    document.getElementById("batchMessage").className = "message";
  }

  async function importBatchCBT() {
    const title = document.getElementById("batchTitle").value.trim();
    const description = document.getElementById("batchDescription").value.trim();
    const categoryId = document.getElementById("batchCategory").value;
    const duration = Number(document.getElementById("batchDuration").value);

    if (!title) { showMessage("batchMessage", "Judul wajib.", "error"); return; }
    if (!categoryId) { showMessage("batchMessage", "Kategori wajib.", "error"); return; }
    if (!Number.isInteger(duration) || duration <= 0) { showMessage("batchMessage", "Durasi tidak valid.", "error"); return; }

    showMessage("batchMessage", "Memvalidasi batch...", "info");
    let batches;
    try {
      batches = [];
      for (let i = 1; i <= 4; i++) { batches.push(parseBatch(i)); updateBatchStatus(i, "✓ Valid — 25 soal", true); }
      const dups = findDuplicateQuestions(batches);
      document.getElementById("batchCount").textContent = "4/4";
      document.getElementById("questionCount").textContent = "100/100";
      document.getElementById("duplicateCount").textContent = dups.length;
      if (dups.length > 0) throw new Error(`${dups.length} soal duplikat. Import dibatalkan.`);
    } catch (e) {
      console.error(e);
      showMessage("batchMessage", e.message, "error"); return;
    }

    if (!confirm(`Gabungkan 4 batch → CBT "${title}" dengan 100 soal?`)) {
      showMessage("batchMessage", "Dibatalkan.", "info"); return;
    }

    showMessage("batchMessage", "Membuat CBT & 100 soal...", "info");
    let quiz = null;

    try {
      const { data, error: qe } = await supabaseClient.from("quizzes").insert({
        title, description: description || null,
        category_id: Number(categoryId), duration_minutes: duration, status: "published"
      }).select().single();
      if (qe) throw new Error("Gagal buat CBT: " + qe.message);
      quiz = data;

      const all = batches.flatMap(b => b.questions);
      if (all.length !== 100) throw new Error(`Setelah gabung: ${all.length} soal (harus 100).`);

      for (let i = 0; i < all.length; i++) {
        const item = all[i], num = i + 1;
        const { data: q, error: qErr } = await supabaseClient.from("quiz_questions").insert({
          quiz_id: quiz.id, question: item.question.trim(),
          explanation: item.explanation || null, question_number: num
        }).select().single();
        if (qErr) throw new Error(`Soal ${num}: ${qErr.message}`);

        const ans = Number(item.answer);
        const opts = item.options.map((o, oi) => {
          const p = parseOptionEntry(o);
          return {
            question_id: q.id, option_text: p.text.trim(),
            explanation: p.explanation, is_correct: oi + 1 === ans
          };
        });
        const { error: oErr } = await supabaseClient.from("quiz_options").insert(opts);
        if (oErr) throw new Error(`Pilihan soal ${num}: ${oErr.message}`);

        if (num === 1 || num % 10 === 0 || num === 100)
          showMessage("batchMessage", `Menyimpan ${num}/100...`, "info");
      }

      showMessage("batchMessage", `🎉 CBT "${title}" dibuat dengan 100 soal.`, "success");
      clearBatchForm(); loadCBTs();
    } catch (e) {
      console.error(e);
      if (quiz) await supabaseClient.from("quizzes").delete().eq("id", quiz.id);
      showMessage("batchMessage", e.message || "Gagal import batch.", "error");
    }
  }

    if (!data || data.length === 0) { c.innerHTML = '<div class="empty">Belum ada CBT.</div>'; return; }

    c.innerHTML = data.map(q => {
      let badge = "badge";
      if (q.status === "published") badge += " badge-published";
      else if (q.status === "draft") badge += " badge-draft";
      else if (q.status === "closed") badge += " badge-closed";

      return `
        <div class="item">
          <div class="item-title">${escapeHtml(q.title)}</div>
          <div class="item-meta">
            Kategori: ${escapeHtml(q.categories?.name || "Tanpa kategori")} •

            ${q.status === "published" ? `<button class="btn-warning" onclick="closeCBT(${q.id})">Tutup CBT</button>` : ""}
            ${q.status === "closed" ? `<button class="btn-success" onclick="publishCBT(${q.id})">Publikasikan Lagi</button>` : ""}

  async function saveCBTEdits() {
    if (!editingQuizId) return;
    const title = document.getElementById("cbtEditQuizTitle").value.trim();
    const description = document.getElementById("cbtEditQuizDescription").value.trim();
    const duration = Number(document.getElementById("cbtEditQuizDuration").value);
    const status = document.getElementById("cbtEditQuizStatus").value;
    const catVal = document.getElementById("cbtEditQuizCategory").value;

    if (!title) { alert("Judul wajib."); return; }
    if (!Number.isInteger(duration) || duration <= 0) { alert("Durasi tidak valid."); return; }

    const btn = document.getElementById("cbtEditSaveBtn");
    btn.disabled = true; btn.textContent = "Menyimpan...";

    try {
      const { error: qe } = await supabaseClient.from("quizzes").update({
        title, description: description || null,
        duration_minutes: duration, status,
        category_id: catVal ? Number(catVal) : null
      }).eq("id", editingQuizId);
      if (qe) throw qe;

      const cards = document.querySelectorAll("#cbtEditQuestions .edit-question-card");
      for (const card of cards) {
        const qId = Number(card.dataset.questionId);
        const qText = card.querySelector(".edit-question-text").value.trim();
        const exp = card.querySelector(".edit-explanation").value.trim();
        if (!qText) throw new Error(`Soal ID ${qId} kosong.`);

        const { error: qErr } = await supabaseClient.from("quiz_questions")
          .update({ question: qText, explanation: exp || null }).eq("id", qId);
        if (qErr) throw qErr;

        const blocks = card.querySelectorAll(".edit-option-block");
        const payload = [];
        blocks.forEach(b => {
          const t = b.querySelector(".edit-option-text").value.trim();
          const e = b.querySelector(".edit-option-explanation").value.trim();
          const r = b.querySelector('input[type="radio"]');
          if (t) payload.push({
            question_id: qId, option_text: t,
            explanation: e || null, is_correct: r.checked
          });
        });

        if (payload.length < 2) throw new Error(`Soal ID ${qId}: minimal 2 pilihan.`);
        if (!payload.some(o => o.is_correct)) throw new Error(`Soal ID ${qId}: belum ada jawaban benar.`);

        const { error: de } = await supabaseClient.from("quiz_options").delete().eq("question_id", qId);
        if (de) throw de;
        const { error: ie } = await supabaseClient.from("quiz_options").insert(payload);
        if (ie) throw ie;
      }

      alert("Perubahan CBT disimpan.");
      closeEditCBTModal(); loadCBTs();
    } catch (e) {
      console.error(e);
      alert("Gagal simpan: " + e.message);
    } finally {
      btn.disabled = false; btn.textContent = "💾 Simpan Perubahan";
    }
  }

  function getOSCEChecklistData() {
    const rows = document.querySelectorAll("#osceChecklistContainer .osce-checklist");
    const out = [];
    rows.forEach((row, i) => {
      const item = row.querySelector(".osce-item-input").value.trim();
      const fb = row.querySelector(".osce-feedback").value.trim();
      const p = row.querySelector(".osce-points-input:checked");
      const points = p ? Number(p.value) : 0;
      if (!item) throw new Error(`Checklist langkah ${i + 1} kosong.`);
      if (!Number.isInteger(points) || points < 0 || points > 3)
        throw new Error(`Poin langkah ${i + 1} harus 0–3.`);
      out.push({ step_number: i + 1, item, feedback: fb || null, points });
    });
    if (out.length === 0) throw new Error("Minimal 1 checklist.");
    return out;
  }

  /* ============================================================
     OSCE — STATION (FIXED)
  ============================================================ */
  async function saveOSCEStation() {
    const title = document.getElementById("osceTitle").value.trim();
    const description = document.getElementById("osceDescription").value.trim();
    const objective = document.getElementById("osceObjective").value.trim();
    const instructions = document.getElementById("osceInstructions").value.trim();
    const folderId = document.getElementById("osceFolder").value || null;

    if (!title) { showMessage("osceMessage", "Judul station wajib.", "error"); return; }

    let checklist;
    try { checklist = getOSCEChecklistData(); }
    catch (e) { showMessage("osceMessage", e.message, "error"); return; }

    showMessage("osceMessage", "Menyimpan station OSCE...", "info");
    let stationId = editingStationId;

    try {
      // Payload dasar
      const payload = {
        title,
        description: description || null,
        objective: objective || null,
        instructions: instructions || null
      };

      // Optional folder_id (hanya jika kolom ada di skema)
      if (folderId !== null) payload.folder_id = Number(folderId);

      if (editingStationId) {
        const { error: ue } = await supabaseClient.from("osce_stations").update(payload).eq("id", editingStationId);
        if (ue) throw new Error("Update station: " + ue.message);

        const { error: de } = await supabaseClient.from("osce_checklists").delete().eq("station_id", editingStationId);
        if (de) throw new Error("Hapus checklist lama: " + de.message);
      } else {
        const { data, error: se } = await supabaseClient.from("osce_stations").insert(payload).select().single();
        if (se) throw new Error("Buat station: " + se.message);
        stationId = data.id;
      }

      // ✅ FIX: syntax error dihilangkan
      const checklistData = checklist.map(c => ({
        station_id: stationId,
        step_number: c.step_number,
        item: c.item,
        feedback: c.feedback,
        points: c.points
      }));

      const { error: ce } = await supabaseClient.from("osce_checklists").insert(checklistData);
      if (ce) {
        if (!editingStationId && stationId)
          await supabaseClient.from("osce_stations").delete().eq("id", stationId);
        throw new Error("Simpan checklist: " + ce.message);
      }

      showMessage("osceMessage",
        editingStationId ? "Station diperbarui." : "Station dibuat.",
        "success");
      clearOSCEForm();
      await loadOSCEStations();
    } catch (e) {
      console.error(e);
      showMessage("osceMessage", e.message || "Terjadi kesalahan.", "error");
    }
  }

  async function loadOSCEStations() {
    const c = document.getElementById("osceStationList");
    if (!c) return;

    // Coba ambil dengan join folder (jika kolom ada)
    let data, error;
    try {
      const res = await supabaseClient.from("osce_stations")
        .select(`*, osce_checklists ( id ), osce_folders ( name )`)
        .order("created_at", { ascending: false });
      data = res.data; error = res.error;
      if (error) throw error;
    } catch (e) {
      // Fallback tanpa folder join
      const res = await supabaseClient.from("osce_stations")
        .select(`*, osce_checklists ( id )`)
        .order("created_at", { ascending: false });
      data = res.data; error = res.error;
    }

    if (error) { console.error(error); c.innerHTML = '<div class="empty">Gagal memuat station.</div>'; return; }
    if (!data || data.length === 0) { c.innerHTML = '<div class="empty">Belum ada station OSCE.</div>'; return; }

    c.innerHTML = data.map(s => {
      const cnt = s.osce_checklists ? s.osce_checklists.length : 0;
      const folderName = s.osce_folders?.name;
      return `
        <div class="osce-station">
          <div class="osce-station-title">${escapeHtml(s.title)}</div>
          <div class="osce-station-meta">
            ${folderName ? `📁 ${escapeHtml(folderName)} • ` : ""}${cnt} checklist
          </div>
          ${s.description ? `<div class="osce-station-section"><strong>Deskripsi</strong><div class="item-description">${escapeHtml(s.description)}</div></div>` : ""}
          ${s.objective ? `<div class="osce-station-section"><strong>Objective</strong><div class="item-description">${escapeHtml(s.objective)}</div></div>` : ""}
          ${s.instructions ? `<div class="osce-station-section"><strong>Instruksi</strong><div class="item-description">${escapeHtml(s.instructions)}</div></div>` : ""}
          <div class="button-row">
            <button type="button" class="btn-warning" onclick="editOSCEStation(${s.id})">Edit</button>
            <button type="button" class="btn-danger" onclick="deleteOSCEStation(${s.id})">Hapus</button>
          </div>
        </div>
      `;
    }).join("");
  }

  async function editOSCEStation(id) {
    showMessage("osceMessage", "Mengambil data station...", "info");

    const { data: st, error: se } = await supabaseClient.from("osce_stations").select("*").eq("id", id).single();
    if (se || !st) { showMessage("osceMessage", "Gagal ambil station.", "error"); return; }

    const { data: checklist, error: ce } = await supabaseClient.from("osce_checklists")
      .select("*").eq("station_id", id).order("step_number", { ascending: true });
    if (ce) { showMessage("osceMessage", "Gagal ambil checklist: " + ce.message, "error"); return; }

    editingStationId = id;
    document.getElementById("osceTitle").value = st.title || "";
    document.getElementById("osceDescription").value = st.description || "";
    document.getElementById("osceObjective").value = st.objective || "";
    document.getElementById("osceInstructions").value = st.instructions || "";

    // ✅ FIX: juga restore folder_id
    const folderSel = document.getElementById("osceFolder");
    if (folderSel) folderSel.value = st.folder_id ? String(st.folder_id) : "";

    resetChecklistRows();
    if (checklist && checklist.length > 0) {
      // ✅ FIX: kirim feedback juga
      checklist.forEach(c => addChecklistRow(c.item, c.points, c.feedback || ""));
    } else {
      addChecklistRow();
    }

    showMessage("osceMessage", "Mode edit aktif.", "info");
    window.scrollTo({
      top: document.getElementById("osceTitle").getBoundingClientRect().top + window.scrollY - 100,
      behavior: "smooth"
    });
  }

  async function deleteOSCEStation(id) {
    if (!confirm("Hapus station ini? Semua checklist terhapus.")) return;
    const { error } = await supabaseClient.from("osce_stations").delete().eq("id", id);
    if (error) { alert("Gagal: " + error.message); return; }
    if (editingStationId === id) clearOSCEForm();
    await loadOSCEStations();
  }

  /* ============================================================
     LOGOUT
  ============================================================ */
  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
  }

  /* ============================================================
     INIT
  ============================================================ */
  async function init() {
    const ok = await checkAdmin();
    if (!ok) return;

    await loadCategories();
    await loadMaterials();
    await loadResourceMaterials();
    await loadResources();
    await loadCBTs();

    await loadOSCEFolders();   // ✅ FIX: load folder
    clearOSCEForm();
    await loadOSCEStations();
  }

  init();
      </script>
