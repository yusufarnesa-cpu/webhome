<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard - Learning Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #172033;
      color: white;
      padding: 18px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: 25px auto;
    }

    .card {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    h2 {
      margin-top: 0;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      margin: 7px 0 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: inherit;
      background: white;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
      margin-right: 6px;
    }

    .save-btn {
      background: #172033;
      color: white;
      width: 100%;
    }

    .add-category-btn {
      background: #172033;
      color: white;
      width: 100%;
    }

    .delete-btn {
      background: #e74c3c;
      color: white;
    }

    .edit-btn {
      background: #f0ad4e;
      color: white;
    }

    .logout-btn {
      background: white;
      color: #172033;
      float: right;
    }

    .material,
    .category-item {
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
    }

    .material h3,
    .category-item h3 {
      margin-top: 0;
    }

    #message,
    #categoryMessage {
      margin-top: 12px;
      font-weight: bold;
    }

    .field-label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-top: 5px;
    }

    .category-info {
      font-size: 13px;
      color: #667085;
      margin-top: -8px;
      margin-bottom: 12px;
    }

    .category-count {
      font-size: 13px;
      color: #667085;
      margin-bottom: 10px;
    }

    .danger-info {
      font-size: 13px;
      color: #667085;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<header>
  <button class="logout-btn" onclick="logout()">Logout</button>
  <h1>Admin Dashboard</h1>
</header>

<div class="container">

  <!-- =========================
       KELOLA BLOK
  ========================== -->

  <div class="card">

    <h2>Kelola Blok Materi</h2>

    <p class="category-info">
      Tambahkan blok baru untuk mengelompokkan materi di halaman Materi.
    </p>

    <label class="field-label" for="categoryName">
      Nama Blok
    </label>

    <input
      type="text"
      id="categoryName"
      placeholder="Contoh: Cardiovascular System"
    >

    <label class="field-label" for="categoryDescription">
      Deskripsi Blok
    </label>

    <textarea
      id="categoryDescription"
      placeholder="Deskripsi singkat tentang blok ini"
    ></textarea>

    <button
      class="add-category-btn"
      onclick="addCategory()">
      + Tambah Blok
    </button>

    <div id="categoryMessage"></div>

    <hr style="margin: 22px 0; border: none; border-top: 1px solid #eee;">

    <h3>Blok yang tersedia</h3>

    <div id="categoryList">
      Memuat blok...
    </div>

  </div>


  <!-- =========================
       TAMBAH / EDIT MATERI
  ========================== -->

  <div class="card">

    <h2 id="formTitle">Tambah Materi</h2>

    <input
      type="text"
      id="title"
      placeholder="Judul materi"
    >

    <input
      type="text"
      id="subject"
      placeholder="Mata kuliah"
    >

    <input
      type="text"
      id="semester"
      placeholder="Semester"
    >

    <input
      type="text"
      id="topic"
      placeholder="Topik"
    >

    <label class="field-label" for="category">
      Blok / Kategori
    </label>

    <select id="category">
      <option value="">
        Pilih blok materi
      </option>
    </select>

    <div class="category-info">
      Pilih blok tempat materi ini akan ditampilkan.
    </div>

    <textarea
      id="description"
      placeholder="Deskripsi materi"
    ></textarea>

    <textarea
      id="content"
      placeholder="Isi materi"
    ></textarea>

    <button
      class="save-btn"
      onclick="saveMaterial()">
      Simpan Materi
    </button>

    <div id="message"></div>

  </div>


  <!-- =========================
       DAFTAR MATERI
  ========================== -->

  <div class="card">

    <h2>Daftar Materi</h2>

    <div id="materials">
      Memuat materi...
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://hqzishiazabguknallei.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_r8rspBje6vjTvUsF9lKYzA_SakK9CD5";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


let editingId = null;


/* =========================
   CEK LOGIN ADMIN
========================= */

async function checkAdmin() {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {

    window.location.href = "login.html";

    return;
  }

  const {
    data: profile,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .single();

  if (
    error ||
    !profile ||
    profile.role !== "admin"
  ) {

    alert("Akses ditolak. Kamu bukan admin.");

    await supabaseClient.auth.signOut();

    window.location.href = "login.html";

    return;
  }

  await loadCategories();

  loadMaterials();

  loadCategoryList();

}


/* =========================
   LOAD KATEGORI
========================= */

async function loadCategories() {

  const select =
    document.getElementById("category");

  const {
    data,
    error
  } =
    await supabaseClient
      .from("categories")
      .select("id, name")
      .order("id", {
        ascending: true
      });

  if (error) {

    console.error(
      "Gagal mengambil kategori:",
      error
    );

    select.innerHTML = `
      <option value="">
        Gagal memuat blok
      </option>
    `;

    return;
  }

  select.innerHTML = `
    <option value="">
      Pilih blok materi
    </option>
  `;

  data.forEach(category => {

    const option =
      document.createElement("option");

    option.value =
      category.id;

    option.textContent =
      category.name;

    select.appendChild(option);

  });

}


/* =========================
   DAFTAR BLOK
========================= */

async function loadCategoryList() {

  const container =
    document.getElementById("categoryList");

  container.innerHTML =
    "Memuat blok...";

  const {
    data,
    error
  } =
    await supabaseClient
      .from("categories")
      .select("*")
      .order("id", {
        ascending: true
      });

  if (error) {

    container.innerHTML =
      "Gagal memuat blok: " +
      error.message;

    return;
  }

  if (!data || data.length === 0) {

    container.innerHTML =
      "Belum ada blok.";

    return;
  }

  container.innerHTML = "";

  data.forEach(category => {

    const div =
      document.createElement("div");

    div.className =
      "category-item";

    div.innerHTML = `

      <h3>
        ${escapeHtml(category.name)}
      </h3>

      <p>
        ${escapeHtml(
          category.description || "Tidak ada deskripsi."
        )}
      </p>

      <button
        class="delete-btn"
        onclick="deleteCategory(${category.id})">
        Hapus Blok
      </button>

    `;

    container.appendChild(div);

  });

}


/* =========================
   TAMBAH BLOK
========================= */

async function addCategory() {

  const name =
    document
      .getElementById("categoryName")
      .value
      .trim();

  const description =
    document
      .getElementById("categoryDescription")
      .value
      .trim();

  const message =
    document.getElementById(
      "categoryMessage"
    );


  if (!name) {

    message.textContent =
      "Nama blok wajib diisi.";

    return;
  }


  message.textContent =
    "Menyimpan blok...";


  const {
    error
  } =
    await supabaseClient
      .from("categories")
      .insert({
        name: name,
        description: description
      });


  if (error) {

    message.textContent =
      "Gagal menambahkan blok: " +
      error.message;

    console.error(error);

    return;
  }


  message.textContent =
    "Blok berhasil ditambahkan.";

  document
    .getElementById("categoryName")
    .value = "";

  document
    .getElementById("categoryDescription")
    .value = "";


  await loadCategories();

  await loadCategoryList();

}


/* =========================
   HAPUS BLOK
========================= */

async function deleteCategory(id) {

  const {
    count,
    error: countError
  } =
    await supabaseClient
      .from("materials")
      .select("id", {
        count: "exact",
        head: true
      })
      .eq("category_id", id);


  if (countError) {

    alert(
      "Gagal memeriksa materi: " +
      countError.message
    );

    return;
  }


  if (count > 0) {

    alert(
      "Blok ini tidak bisa dihapus karena masih memiliki " +
      count +
      " materi."
    );

    return;
  }


  const yakin =
    confirm(
      "Yakin ingin menghapus blok ini?"
    );


  if (!yakin) return;


  const {
    error
  } =
    await supabaseClient
      .from("categories")
      .delete()
      .eq("id", id);


  if (error) {

    alert(
      "Gagal menghapus blok: " +
      error.message
    );

    return;
  }


  await loadCategories();

  await loadCategoryList();

}


/* =========================
   LOAD MATERIAL
========================= */

async function loadMaterials() {

  const container =
    document.getElementById("materials");

  container.innerHTML =
    "Memuat...";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("materials")
      .select(`
        *,
        categories (
          name
        )
      `)
      .order("created_at", {
        ascending: false
      });


  if (error) {

    container.innerHTML =
      "Gagal memuat materi: " +
      error.message;

    console.error(error);

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML =
      "Belum ada materi.";

    return;
  }


  container.innerHTML = "";


  data.forEach(material => {

    const div =
      document.createElement("div");

    div.className =
      "material";


    const categoryName =
      material.categories &&
      material.categories.name
        ? material.categories.name
        : "-";


    div.innerHTML = `

      <h3>
        ${escapeHtml(material.title)}
      </h3>

      <p>
        <strong>Blok:</strong>
        ${escapeHtml(categoryName)}
      </p>

      <p>
        <strong>Mata kuliah:</strong>
        ${escapeHtml(material.subject || "-")}
      </p>

      <p>
        <strong>Semester:</strong>
        ${escapeHtml(material.semester || "-")}
      </p>

      <p>
        ${escapeHtml(
          material.description || ""
        )}
      </p>

      <button
        class="edit-btn"
        onclick="editMaterial('${material.id}')">
        Edit
      </button>

      <button
        class="delete-btn"
        onclick="deleteMaterial('${material.id}')">
        Hapus
      </button>

    `;


    container.appendChild(div);

  });

}


/* =========================
   SIMPAN / UPDATE MATERIAL
========================= */

async function saveMaterial() {

  const title =
    document
      .getElementById("title")
      .value
      .trim();

  const subject =
    document
      .getElementById("subject")
      .value
      .trim();

  const semester =
    document
      .getElementById("semester")
      .value
      .trim();

  const topic =
    document
      .getElementById("topic")
      .value
      .trim();

  const description =
    document
      .getElementById("description")
      .value
      .trim();

  const content =
    document
      .getElementById("content")
      .value
      .trim();

  const category =
    document
      .getElementById("category")
      .value;

  const message =
    document.getElementById("message");


  if (!title) {

    message.textContent =
      "Judul materi wajib diisi.";

    return;
  }


  if (!category) {

    message.textContent =
      "Blok / kategori wajib dipilih.";

    return;
  }


  message.textContent =
    "Menyimpan...";


  const materialData = {

    title,

    subject,

    semester,

    topic,

    description,

    content,

    category_id:
      Number(category),

    status:
      "published"

  };


  let result;


  if (editingId) {

    result =
      await supabaseClient
        .from("materials")
        .update(materialData)
        .eq(
          "id",
          editingId
        );

  }

  else {

    result =
      await supabaseClient
        .from("materials")
        .insert(
          materialData
        );

  }


  if (result.error) {

    message.textContent =
      "Gagal: " +
      result.error.message;

    console.error(
      result.error
    );

    return;
  }


  message.textContent =
    editingId
      ? "Materi berhasil diperbarui."
      : "Materi berhasil ditambahkan.";


  editingId = null;


  clearForm();


  document
    .getElementById("formTitle")
    .textContent =
      "Tambah Materi";


  loadMaterials();

}


/* =========================
   EDIT MATERIAL
========================= */

async function editMaterial(id) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("materials")
      .select("*")
      .eq("id", id)
      .single();


  if (error) {

    alert(
      "Gagal mengambil materi."
    );

    return;
  }


  editingId =
    id;


  document
    .getElementById("formTitle")
    .textContent =
      "Edit Materi";


  document
    .getElementById("title")
    .value =
      data.title || "";

  document
    .getElementById("subject")
    .value =
      data.subject || "";

  document
    .getElementById("semester")
    .value =
      data.semester || "";

  document
    .getElementById("topic")
    .value =
      data.topic || "";

  document
    .getElementById("description")
    .value =
      data.description || "";

  document
    .getElementById("content")
    .value =
      data.content || "";

  document
    .getElementById("category")
    .value =
      data.category_id || "";


  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

}


/* =========================
   HAPUS MATERIAL
========================= */

async function deleteMaterial(id) {

  const yakin =
    confirm(
      "Yakin ingin menghapus materi ini?"
    );


  if (!yakin) return;


  const {
    error
  } =
    await supabaseClient
      .from("materials")
      .delete()
      .eq(
        "id",
        id
      );


  if (error) {

    alert(
      "Gagal menghapus: " +
      error.message
    );

    return;
  }


  loadMaterials();

}


/* =========================
   CLEAR FORM
========================= */

function clearForm() {

  document
    .getElementById("title")
    .value = "";

  document
    .getElementById("subject")
    .value = "";

  document
    .getElementById("semester")
    .value = "";

  document
    .getElementById("topic")
    .value = "";

  document
    .getElementById("description")
    .value = "";

  document
    .getElementById("content")
    .value = "";

  document
    .getElementById("category")
    .value = "";

}


/* =========================
   LOGOUT
========================= */

async function logout() {

  await supabaseClient
    .auth
    .signOut();

  window.location.href =
    "login.html";

}


/* =========================
   KEAMANAN OUTPUT
========================= */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* =========================
   MULAI
========================= */

checkAdmin();

</script>

</body>
</html>
