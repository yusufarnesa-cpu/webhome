<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Materi | Medical Learning Hub</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        /* NAVBAR */

        nav {
            background: #0f172a;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }

        nav a:hover {
            opacity: 0.8;
        }

        /* HEADER */

        .hero {
            padding: 60px 7% 40px;
            background: white;
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .hero p {
            color: #64748b;
            max-width: 700px;
            line-height: 1.6;
        }

        /* CONTAINER */

        .container {
            width: 86%;
            max-width: 1200px;
            margin: 40px auto;
        }

        /* CATEGORY */

        .category-block {
            margin-bottom: 50px;
        }

        .category-title {
            font-size: 26px;
            margin-bottom: 20px;
            color: #0f172a;
            border-left: 5px solid #2563eb;
            padding-left: 12px;
        }

        /* GRID */

        .materials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
        }

        /* CARD */

        .material-card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
            transition: 0.2s;
            display: flex;
            flex-direction: column;
        }

        .material-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.10);
        }

        .material-card h3 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #111827;
        }

        .description {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .meta {
            font-size: 13px;
            color: #64748b;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .meta strong {
            color: #334155;
        }

        /* BUTTON */

        .open-button {
            display: inline-block;
            margin-top: auto;
            background: #2563eb;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
            transition: 0.2s;
        }

        .open-button:hover {
            background: #1d4ed8;
        }

        /* EMPTY */

        .empty {
            background: white;
            padding: 30px;
            border-radius: 12px;
            color: #64748b;
            text-align: center;
        }

        /* LOADING */

        .loading {
            text-align: center;
            padding: 50px;
            color: #64748b;
        }

        /* FOOTER */

        footer {
            margin-top: 80px;
            background: #0f172a;
            color: #cbd5e1;
            text-align: center;
            padding: 30px;
            font-size: 14px;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin-left: 10px;
                margin-right: 10px;
            }

            .hero h1 {
                font-size: 28px;
            }

            .container {
                width: 92%;
            }

        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<nav>

    <div class="logo">
        Medical Learning Hub
    </div>

    <div>

        <a href="../index.html">
            Home
        </a>

        <a href="index.html">
            Materi
        </a>

        <a href="#">
            Quiz
        </a>

        <a href="#">
            Referensi
        </a>

    </div>

</nav>



<!-- HERO -->

<section class="hero">

    <h1>
        Materi Pembelajaran
    </h1>

    <p>
        Kumpulan materi pembelajaran kedokteran yang
        disusun berdasarkan kategori dan dapat diakses
        secara terstruktur melalui Medical Learning Hub.
    </p>

</section>



<!-- MATERIALS -->

<main class="container">

    <div id="materials-container">

        <div class="loading">
            Memuat materi...
        </div>

    </div>

</main>



<!-- FOOTER -->

<footer>

    Medical Learning Hub © 2026

</footer>



<script>


/* ==============================
   SUPABASE
============================== */


const SUPABASE_URL =
    "https://hqzishiazabguknallei.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_r8rspBje6vjTvUsF9lKYzA_SakK9CD5";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );



/* ==============================
   LOAD MATERIALS
============================== */


async function loadMaterials() {

    const container =
        document.getElementById(
            "materials-container"
        );


    try {


        /* GET CATEGORIES */

        const {
            data: categories,
            error: categoryError
        } = await supabaseClient
            .from("categories")
            .select("*")
            .order("id", {
                ascending: true
            });


        if (categoryError) {

            throw categoryError;

        }



        /* GET MATERIALS */

        const {
            data: materials,
            error: materialError
        } = await supabaseClient
            .from("materials")
            .select("*")
            .eq("status", "published")
            .order("created_at", {
                ascending: false
            });


        if (materialError) {

            throw materialError;

        }



        /* CLEAR */

        container.innerHTML = "";



        /* NO CATEGORY */

        if (!categories || categories.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    Belum ada kategori materi.
                </div>
            `;

            return;

        }



        /* LOOP CATEGORY */

        categories.forEach(function(category) {


            const categoryMaterials =
                (materials || []).filter(
                    function(material) {

                        return Number(
                            material.category_id
                        ) === Number(
                            category.id
                        );

                    }
                );



            /* CATEGORY BLOCK */

            const categoryBlock =
                document.createElement("section");

            categoryBlock.className =
                "category-block";



            /* CATEGORY TITLE */

            const categoryTitle =
                document.createElement("h2");

            categoryTitle.className =
                "category-title";

            categoryTitle.textContent =
                category.name;



            categoryBlock.appendChild(
                categoryTitle
            );



            /* EMPTY CATEGORY */

            if (
                categoryMaterials.length === 0
            ) {

                const empty =
                    document.createElement("div");

                empty.className =
                    "empty";

                empty.textContent =
                    "Belum ada materi pada kategori ini.";

                categoryBlock.appendChild(
                    empty
                );

                container.appendChild(
                    categoryBlock
                );

                return;

            }



            /* GRID */

            const grid =
                document.createElement("div");

            grid.className =
                "materials-grid";



            /* LOOP MATERIAL */

            categoryMaterials.forEach(
                function(material) {


                    /* CARD */

                    const card =
                        document.createElement("article");

                    card.className =
                        "material-card";



                    /* TITLE */

                    const title =
                        document.createElement("h3");

                    title.textContent =
                        material.title || "Tanpa judul";



                    /* DESCRIPTION */

                    const description =
                        document.createElement("p");

                    description.className =
                        "description";

                    description.textContent =
                        material.description ||
                        "Tidak ada deskripsi materi.";



                    /* META */

                    const meta =
                        document.createElement("div");

                    meta.className =
                        "meta";


                    meta.innerHTML = `

                        ${
                            material.subject
                            ? `<strong>Mata Kuliah:</strong>
                               ${material.subject}<br>`
                            : ""
                        }

                        ${
                            material.semester
                            ? `<strong>Semester:</strong>
                               ${material.semester}<br>`
                            : ""
                        }

                        ${
                            material.topic
                            ? `<strong>Topik:</strong>
                               ${material.topic}<br>`
                            : ""
                        }

                        ${
                            material.author
                            ? `<strong>Penulis:</strong>
                               ${material.author}`
                            : ""
                        }

                    `;



                    /* BUTTON */

                    const button =
                        document.createElement("a");


                    button.className =
                        "open-button";


                    button.textContent =
                        "Buka Materi →";


                    /*
                       PENTING:

                       detail.html berada di root,
                       sedangkan halaman ini berada
                       di folder /materi/

                       Jadi kita naik satu folder
                       menggunakan ../
                    */

                    button.href =
                        "../detail.html?id=" +
                        material.id;



                    /* APPEND */

                    card.appendChild(
                        title
                    );

                    card.appendChild(
                        description
                    );

                    card.appendChild(
                        meta
                    );

                    card.appendChild(
                        button
                    );


                    grid.appendChild(
                        card
                    );

                }
            );



            categoryBlock.appendChild(
                grid
            );


            container.appendChild(
                categoryBlock
            );


        });


    }

    catch (error) {

        console.error(
            "Gagal memuat materi:",
            error
        );


        container.innerHTML = `

            <div class="empty">

                Gagal memuat materi.

                <br><br>

                <small>
                    ${error.message || error}
                </small>

            </div>

        `;

    }

}



/* ==============================
   START
============================== */


loadMaterials();


</script>


</body>

</html>
