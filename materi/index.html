<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Materi | Medical Learning Hub</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }


        /* =========================
           NAVBAR
        ========================= */

        nav {
            background: #0f172a;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }

        nav a:hover {
            opacity: 0.8;
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            padding: 60px 7% 40px;
            background: white;
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .hero p {
            color: #64748b;
            max-width: 700px;
            line-height: 1.6;
        }


        /* =========================
           FILTER AREA
        ========================= */

        .filter-section {
            width: 86%;
            max-width: 1200px;
            margin: 30px auto 0;
        }

        .filter-box {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .filter-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #0f172a;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 12px;
        }

        .search-input,
        .filter-select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d0d5dd;
            border-radius: 9px;
            font-size: 14px;
            background: white;
            color: #1f2937;
            outline: none;
        }

        .search-input:focus,
        .filter-select:focus {
            border-color: #2563eb;
        }

        .result-info {
            margin-top: 14px;
            color: #64748b;
            font-size: 14px;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 86%;
            max-width: 1200px;
            margin: 40px auto;
        }


        /* =========================
           CATEGORY
        ========================= */

        .category-block {
            margin-bottom: 50px;
        }

        .category-title {
            font-size: 26px;
            margin-bottom: 20px;
            color: #0f172a;
            border-left: 5px solid #2563eb;
            padding-left: 12px;
        }


        /* =========================
           GRID
        ========================= */

        .materials-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(280px, 1fr)
            );
            gap: 22px;
        }


        /* =========================
           CARD
        ========================= */

        .material-card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
            transition: 0.2s;
            display: flex;
            flex-direction: column;
        }

        .material-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.10);
        }

        .material-card h3 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #111827;
        }

        .description {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .meta {
            font-size: 13px;
            color: #64748b;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .meta strong {
            color: #334155;
        }


        /* =========================
           BUTTON
        ========================= */

        .open-button {
            display: inline-block;
            margin-top: auto;
            background: #2563eb;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
            transition: 0.2s;
        }

        .open-button:hover {
            background: #1d4ed8;
        }


        /* =========================
           EMPTY
        ========================= */

        .empty {
            background: white;
            padding: 30px;
            border-radius: 12px;
            color: #64748b;
            text-align: center;
        }


        /* =========================
           LOADING
        ========================= */

        .loading {
            text-align: center;
            padding: 50px;
            color: #64748b;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            margin-top: 80px;
            background: #0f172a;
            color: #cbd5e1;
            text-align: center;
            padding: 30px;
            font-size: 14px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin-left: 10px;
                margin-right: 10px;
            }

            .hero h1 {
                font-size: 28px;
            }

            .container,
            .filter-section {
                width: 92%;
            }

            .filter-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav>

    <div class="logo">
        Medical Learning Hub
    </div>

    <div>

        <a href="../index.html">
            Home
        </a>

        <a href="index.html">
            Materi
        </a>

        <a href="#">
            Quiz
        </a>

        <a href="#">
            Referensi
        </a>

    </div>

</nav>


<!-- =========================
     HERO
========================= -->

<section class="hero">

    <h1>
        Materi Pembelajaran
    </h1>

    <p>
        Kumpulan materi pembelajaran kedokteran yang
        disusun berdasarkan kategori dan dapat diakses
        secara terstruktur melalui Medical Learning Hub.
    </p>

</section>


<!-- =========================
     SEARCH & FILTER
========================= -->

<section class="filter-section">

    <div class="filter-box">

        <div class="filter-title">
            Cari dan Filter Materi
        </div>

        <div class="filter-grid">

            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="🔎 Cari judul, mata kuliah, topik..."
            >

            <select
                id="categoryFilter"
                class="filter-select"
            >

                <option value="">
                    Semua Kategori
                </option>

            </select>


            <select
                id="semesterFilter"
                class="filter-select"
            >

                <option value="">
                    Semua Semester
                </option>

            </select>

        </div>


        <div
            id="resultInfo"
            class="result-info"
        >
            Memuat materi...
        </div>

    </div>

</section>


<!-- =========================
     MATERIALS
========================= -->

<main class="container">

    <div id="materials-container">

        <div class="loading">
            Memuat materi...
        </div>

    </div>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer>

    Medical Learning Hub © 2026

</footer>


<script>


/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
    "https://hqzishiazabguknallei.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_r8rspBje6vjTvUsF9lKYzA_SakK9CD5";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* ==============================
   ELEMENTS
============================== */

const container =
    document.getElementById(
        "materials-container"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const categoryFilter =
    document.getElementById(
        "categoryFilter"
    );


const semesterFilter =
    document.getElementById(
        "semesterFilter"
    );


const resultInfo =
    document.getElementById(
        "resultInfo"
    );


/* ==============================
   GLOBAL DATA
============================== */

let allCategories = [];

let allMaterials = [];


/* ==============================
   LOAD DATA
============================== */

async function loadMaterials() {

    try {

        /* GET CATEGORIES */

        const {
            data: categories,
            error: categoryError
        } = await supabaseClient
            .from("categories")
            .select("*")
            .order("id", {
                ascending: true
            });


        if (categoryError) {
            throw categoryError;
        }


        /* GET MATERIALS */

        const {
            data: materials,
            error: materialError
        } = await supabaseClient
            .from("materials")
            .select("*")
            .eq("status", "published")
            .order("created_at", {
                ascending: false
            });


        if (materialError) {
            throw materialError;
        }


        allCategories =
            categories || [];


        allMaterials =
            materials || [];


        /* POPULATE FILTERS */

        populateCategoryFilter();

        populateSemesterFilter();


        /* FIRST DISPLAY */

        renderMaterials(
            allMaterials
        );

    }

    catch (error) {

        console.error(
            "Gagal memuat materi:",
            error
        );


        container.innerHTML = `

            <div class="empty">

                Gagal memuat materi.

                <br><br>

                <small>
                    ${escapeHtml(
                        error.message || error
                    )}
                </small>

            </div>

        `;

        resultInfo.textContent =
            "Materi gagal dimuat.";

    }

}


/* ==============================
   CATEGORY FILTER
============================== */

function populateCategoryFilter() {

    categoryFilter.innerHTML = `

        <option value="">
            Semua Kategori
        </option>

    `;


    allCategories.forEach(
        function(category) {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                category.id;

            option.textContent =
                category.name;

            categoryFilter.appendChild(
                option
            );

        }
    );

}


/* ==============================
   SEMESTER FILTER
============================== */

function populateSemesterFilter() {

    const semesters =
        allMaterials
            .map(function(material) {
                return material.semester;
            })
            .filter(function(semester) {
                return semester !== null &&
                       semester !== undefined &&
                       String(semester).trim() !== "";
            })
            .map(function(semester) {
                return String(semester).trim();
            });


    const uniqueSemesters =
        [...new Set(semesters)]
            .sort(function(a, b) {

                const numberA =
                    parseInt(a);

                const numberB =
                    parseInt(b);

                if (
                    !isNaN(numberA) &&
                    !isNaN(numberB)
                ) {
                    return numberA - numberB;
                }

                return a.localeCompare(b);
            });


    semesterFilter.innerHTML = `

        <option value="">
            Semua Semester
        </option>

    `;


    uniqueSemesters.forEach(
        function(semester) {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                semester;

            option.textContent =
                "Semester " + semester;

            semesterFilter.appendChild(
                option
            );

        }
    );

}


/* ==============================
   FILTER MATERIALS
============================== */

function filterMaterials() {

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const selectedCategory =
        categoryFilter.value;


    const selectedSemester =
        semesterFilter.value;


    const filtered =
        allMaterials.filter(
            function(material) {

                /* SEARCH */

                const searchableText = [

                    material.title,

                    material.description,

                    material.subject,

                    material.topic,

                    material.author

                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();


                const matchesSearch =
                    !search ||
                    searchableText.includes(
                        search
                    );


                /* CATEGORY */

                const matchesCategory =
                    !selectedCategory ||
                    Number(
                        material.category_id
                    ) === Number(
                        selectedCategory
                    );


                /* SEMESTER */

                const matchesSemester =
                    !selectedSemester ||
                    String(
                        material.semester || ""
                    ).trim() ===
                    selectedSemester;


                return (
                    matchesSearch &&
                    matchesCategory &&
                    matchesSemester
                );

            }
        );


    renderMaterials(
        filtered
    );

}


/* ==============================
   RENDER MATERIALS
============================== */

function renderMaterials(
    materials
) {

    container.innerHTML = "";


    resultInfo.textContent =
        materials.length +
        " materi ditemukan";


    /* NO RESULT */

    if (
        !materials ||
        materials.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                <h3>
                    Materi tidak ditemukan
                </h3>

                <br>

                <p>
                    Coba gunakan kata kunci
                    atau filter yang berbeda.
                </p>

            </div>

        `;

        return;

    }


    /* LOOP CATEGORY */

    allCategories.forEach(
        function(category) {

            const categoryMaterials =
                materials.filter(
                    function(material) {

                        return Number(
                            material.category_id
                        ) === Number(
                            category.id
                        );

                    }
                );


            /* SKIP EMPTY CATEGORY */

            if (
                categoryMaterials.length === 0
            ) {
                return;
            }


            /* CATEGORY BLOCK */

            const categoryBlock =
                document.createElement(
                    "section"
                );

            categoryBlock.className =
                "category-block";


            /* CATEGORY TITLE */

            const categoryTitle =
                document.createElement(
                    "h2"
                );

            categoryTitle.className =
                "category-title";

            categoryTitle.textContent =
                category.name;


            categoryBlock.appendChild(
                categoryTitle
            );


            /* GRID */

            const grid =
                document.createElement(
                    "div"
                );

            grid.className =
                "materials-grid";


            /* MATERIAL CARDS */

            categoryMaterials.forEach(
                function(material) {

                    const card =
                        document.createElement(
                            "article"
                        );

                    card.className =
                        "material-card";


                    /* TITLE */

                    const title =
                        document.createElement(
                            "h3"
                        );

                    title.textContent =
                        material.title ||
                        "Tanpa judul";


                    /* DESCRIPTION */

                    const description =
                        document.createElement(
                            "p"
                        );

                    description.className =
                        "description";

                    description.textContent =
                        material.description ||
                        "Tidak ada deskripsi materi.";


                    /* META */

                    const meta =
                        document.createElement(
                            "div"
                        );

                    meta.className =
                        "meta";


                    meta.innerHTML = `

                        ${
                            material.subject
                            ? `<strong>Mata Kuliah:</strong>
                               ${escapeHtml(
                                   material.subject
                               )}<br>`
                            : ""
                        }

                        ${
                            material.semester
                            ? `<strong>Semester:</strong>
                               ${escapeHtml(
                                   material.semester
                               )}<br>`
                            : ""
                        }

                        ${
                            material.topic
                            ? `<strong>Topik:</strong>
                               ${escapeHtml(
                                   material.topic
                               )}<br>`
                            : ""
                        }

                        ${
                            material.author
                            ? `<strong>Penulis:</strong>
                               ${escapeHtml(
                                   material.author
                               )}`
                            : ""
                        }

                    `;


                    /* BUTTON */

                    const button =
                        document.createElement(
                            "a"
                        );

                    button.className =
                        "open-button";

                    button.textContent =
                        "Buka Materi →";


                    button.href =
                        "../detail.html?id=" +
                        material.id;


                    /* APPEND */

                    card.appendChild(
                        title
                    );

                    card.appendChild(
                        description
                    );

                    card.appendChild(
                        meta
                    );

                    card.appendChild(
                        button
                    );


                    grid.appendChild(
                        card
                    );

                }
            );


            categoryBlock.appendChild(
                grid
            );


            container.appendChild(
                categoryBlock
            );

        }
    );

}


/* ==============================
   EVENTS
============================== */

searchInput.addEventListener(
    "input",
    filterMaterials
);


categoryFilter.addEventListener(
    "change",
    filterMaterials
);


semesterFilter.addEventListener(
    "change",
    filterMaterials
);


/* ==============================
   SECURITY
============================== */

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==============================
   START
============================== */

loadMaterials();

</script>


</body>

</html>
